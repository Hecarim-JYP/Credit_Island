<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>이수 퀘스트 자동 플레이 테스트</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <!-- 사용법: ?run=full 전체 자동 플레이 / ?shot=field|ask|rev|result|menu|clear 특정 화면에서 멈춤 -->
  <div id="app">
    <canvas id="field"></canvas>
    <div id="hud"></div>
    <div id="dpad"></div>
    <div id="ui"></div>
    <div id="toasts"></div>
  </div>
  <script>
    window.__errs = [];
    window.addEventListener('error', (e) => window.__errs.push(`${e.message} @${e.lineno}:${e.colno}`));
    try { localStorage.clear(); } catch (e) { /* 무시 */ }
  </script>
  <script src="../js/banks/extra.js"></script>
  <script src="../js/banks/cpp.js"></script>
  <script src="../js/banks/unix.js"></script>
  <script src="../js/banks/os.js"></script>
  <script src="../js/banks/pl.js"></script>
  <script src="../js/banks/cloud.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/game.js"></script>
  <script>
    (() => {
      const G = window.__game, params = new URLSearchParams(location.search);
      const out = [];
      const report = () => {
        const pre = document.createElement('pre');
        pre.id = 'result';
        pre.style.display = 'none';
        pre.textContent = JSON.stringify({ out, errs: window.__errs });
        document.body.appendChild(pre);
      };
      const finishBattle = (strategy) => {
        let guard = 0;
        while (G.B && G.B.phase !== 'end' && guard++ < 300) {
          const B = G.B;
          if (B.phase === 'ask') {
            if (strategy === 'wrong') G.answer((B.q.answer + 1) % 4, false);
            else {
              if (B.asked === 2 && !B.removed.length && G.S.bag.highlighter) G.useItem('highlighter');
              if (B.asked === 3 && !B.energy && G.S.bag.energy) G.useItem('energy');
              if (B.asked === 4 && G.S.bag.pass) { G.useItem('pass'); continue; }
              G.answer(B.q.answer, false);
            }
          } else if (B.phase === 'revPick') G.pickCard(guard % 3);
          else if (B.phase === 'revJudge') G.judge(strategy === 'wrong' ? B.monsterWrong : !B.monsterWrong);
          else G.battleNext();
        }
      };
      try {
        document.getElementById('nameInput').value = '테스터';
        G.ACT.newgame();
        const shot = params.get('shot');
        out.push(`stages=${STAGES.length} startMode=${G.mode}`);
        // ?c=과목번호 로 들어갈 과목 지정 (shot=courses면 수강신청 화면에 머문다)
        if (shot !== 'courses') G.ACT.course(Number(params.get('c') || 0));
        const lecIdx = Number(params.get('l') || 2);
        if (params.get('run') === 'full') {
          // 낙제 한 번
          G.startBattle(STAGES[0].lectures[0]);
          G.battleNext();
          finishBattle('wrong');
          out.push(`lose: won=${G.B.won} focus=${G.S.focus}`);
          G.battleNext();
          for (let s = 0; s < STAGES.length; s++) {
            if (s > 0) G.ACT.course(s);
            for (const lec of STAGES[G.S.stage].lectures) {
              G.startBattle(lec);
              G.battleNext();
              finishBattle('right');
              const B = G.B;
              out.push(`${lec.id}: won=${B.won} grade=${B.summary && B.summary.grade} turns=${B.turn} asked=${B.asked} lv=${G.S.level} items=${B.itemsUsed}`);
              G.battleNext();
            }
            out.push(`stage ${s} clear: mode=${G.mode} done=${Object.keys(G.S.done)}`);
            if (s < STAGES.length - 1) G.ACT.courses(); else G.ACT.ending();
          }
          out.push(`graduated=${G.S.graduated} mode=${G.mode} lv=${G.S.level} bag=${JSON.stringify(G.S.bag)}`);
          out.push(`ach=${Object.keys(G.S.ach).join(',')}`);
          out.push(`stats=${JSON.stringify(G.S.stats)}`);
        } else if (shot === 'ask' || shot === 'result' || shot === 'rev' || shot === 'revpick') {
          G.startBattle(STAGES[G.S.stage].lectures[lecIdx]);
          G.battleNext();
          if (shot === 'ask') G.useItem('highlighter');
          if (shot === 'result') G.answer((G.B.q.answer + 1) % 4, false);
          if (shot === 'rev' || shot === 'revpick') {
            G.answer(G.B.q.answer, false); G.battleNext();
            G.answer(G.B.q.answer, false); G.battleNext();
            if (shot === 'rev') G.pickCard(1);
          }
        } else if (params.get('run') === 'walk') {
          // 실제 키 입력으로 위로 한 칸, 오른쪽으로 쭉 → 첫 강의와 부딪혀 배틀 시작
          const key = (type, code) => document.dispatchEvent(new KeyboardEvent(type, { code, key: code, bubbles: true }));
          // 헤드리스에서는 requestAnimationFrame이 멈추므로 필드 갱신을 직접 16ms씩 돌린다
          // 시작 지점 위는 표지판이라 막혀 있어야 한다
          key('keydown', 'ArrowUp');
          for (let i = 0; i < 20; i++) G.tick(16);
          key('keyup', 'ArrowUp');
          out.push(`after up: pos=${G.P.x},${G.P.y}`);
          key('keydown', 'ArrowRight');
          let frames = 0;
          while (frames < 400 && G.mode === 'field') { G.tick(16); frames++; }
          key('keyup', 'ArrowRight');
          out.push(`after walk: frames=${frames} mode=${G.mode} pos=${G.P.x},${G.P.y} dir=${G.P.dir} lec=${G.B && G.B.lec.id}`);
        } else if (shot === 'world') {
          G.ACT.courses();
        } else if (shot === 'menu') {
          G.ACT.menu();
        } else if (shot === 'achmenu') {
          G.ACT.menu(); G.ACT.tab('ach');
        }
      } catch (e) { window.__errs.push(`EXC ${e.message} ${e.stack}`); }
      setTimeout(report, 300);
    })();
  </script>
</body>
</html>
